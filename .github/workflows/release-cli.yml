name: release-cli

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., 1.0.0). Auto-generated if empty."
        required: false
        type: string
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Generate version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build CLI (linux only)
        run: |
          bun packages/igris/script/build.ts --single --skip-embed-web-ui
        env:
          IGRIS_VERSION: ${{ steps.version.outputs.version }}
          IGRIS_CHANNEL: latest

      - name: Package artifact
        run: |
          mkdir -p release-assets
          for dir in packages/igris/dist/igris-*; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            tar -czf "release-assets/$name.tar.gz" -C "$dir/bin" .
          done
          ls -la release-assets/

      - name: Delete old release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=v${{ steps.version.outputs.version }}
          gh release delete "$VERSION" --yes --cleanup-tag 2>/dev/null || true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=v${{ steps.version.outputs.version }}
          echo "Creating release: $VERSION"
          gh release create "$VERSION" \
            --title "igris $VERSION" \
            --notes "Build from ${{ github.sha }}"
          echo "Uploading artifacts..."
          for f in release-assets/*; do
            [ -f "$f" ] || continue
            echo "Uploading: $f"
            gh release upload "$VERSION" "$f" --clobber
          done
          echo "Release created successfully!"

      - name: Cleanup old releases (keep last 2)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Listing releases..."
          gh release list --limit 10
          echo ""
          echo "Keeping only last 2 releases..."
          gh release list --limit 10 --json tagName --jq '.[].tagName' | head -n -2 | while read -r tag; do
            echo "Deleting: $tag"
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          done
          echo "Done!"
