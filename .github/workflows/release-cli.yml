name: release-cli

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., 1.0.0). Auto-generated if empty."
        required: false
        type: string
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Generate version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build CLI (linux only)
        run: |
          bun packages/igris/script/build.ts --single --skip-embed-web-ui
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}

      - name: Package artifact
        run: |
          mkdir -p release-assets
          for dir in packages/igris/dist/igris-*; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            tar -czf "release-assets/$name.tar.gz" -C "$dir/bin" .
          done
          ls -la release-assets/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=v${{ steps.version.outputs.version }}
          gh release delete "$VERSION" --yes 2>/dev/null || true
          gh release create "$VERSION" \
            --title "igris $VERSION" \
            --notes "Build from ${{ github.sha }}"
          for f in release-assets/*; do
            [ -f "$f" ] || continue
            gh release upload "$VERSION" "$f"
          done

      - name: Keep only last 2 releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 50 --json tagName --jq '.[].tagName' | head -n -2 | while read -r tag; do
            echo "Deleting old release: $tag"
            gh release delete "$tag" --yes 2>/dev/null || true
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" --silent 2>/dev/null || true
          done
