name: release-cli

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build CLI (linux only)
        run: |
          bun packages/igris/script/build.ts --single --skip-embed-web-ui
        env:
          IGRIS_VERSION: latest
          IGRIS_CHANNEL: latest

      - name: Package artifact
        run: |
          mkdir -p release-assets
          for dir in packages/igris/dist/igris-*; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            tar -czf "release-assets/$name.tar.gz" -C "$dir/bin" .
          done
          ls -la release-assets/

      - name: Upload to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          git tag -d latest 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          gh release create latest \
            --title "igris latest" \
            --notes "Latest build from ${{ github.sha }}"
          for f in release-assets/*; do
            [ -f "$f" ] || continue
            gh release upload latest "$f" --clobber
          done
